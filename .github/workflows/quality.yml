name: Verify Cocktail Atlas
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check tour.js
      - run: node --check my-recipes.js
      - run: node --check my-recipes-ui.js
      - run: node --check ingredient-enhancements.js
      - run: node --check sommelier-pairings.js
      - run: node --check sommelier-bottles.js
      - run: node --check sommelier-tried.js
      - run: node --check sommelier.js
      - run: node --check recipe-measurements.js
      - run: node --check app.js
      - run: node --check shakerrr-library.js
      - run: node tests/expanded_route_test.cjs
      - run: node tests/my_recipes_test.cjs
      - run: node tests/measurement_units_test.cjs
      - run: node tests/sommelier_world_test.cjs
      - run: node tests/sommelier_specific_bottles_test.cjs
      - run: node tests/sommelier_tried_wines_test.cjs
      - run: node tests/sommelier_curated_food_test.cjs
